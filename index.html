<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lando Norris Hero Concept</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Smooth Scroll Container Wrapper -->
  <main id="scroll-content">
    
    <!-- Navigation Overlay -->
    <nav class="navbar">
      <div class="logo">LN<span class="vibrant">04</span></div>
      <div class="menu-btn">MENU</div>
    </nav>

    <!-- Fullscreen Interactive Hero Section -->
    <section class="hero-section">
      
      <!-- Background Visuals -->
      <div class="hero-bg"></div>

      <!-- Giant Typography Layered Under Foreground -->
      <div class="background-text-wrapper">
        <h1 class="giant-text text-stroke">NORRIS</h1>
      </div>

      <!-- Interactive Composite Canvas Wrapper -->
      <div class="interactive-canvas-container">
        <canvas id="hero-reveal-canvas"></canvas>
      </div>

      <!-- Foreground Typography Overlapping Images -->
      <div class="foreground-text-wrapper">
        <h1 class="giant-text text-filled">NORRIS</h1>
      </div>

      <!-- Bottom Status Bar details -->
      <div class="hero-footer">
        <div class="footer-item"><span>TEAM</span><p>MCLAREN F1</p></div>
        <div class="footer-item"><span>STATUS</span><p>ON TRACK</p></div>
      </div>

    </section>

    <!-- Content Spacer Section to test Lenis Smooth Scrolling -->
    <section class="spacer-section">
      <h2>SCROLL TO DISCOVER MORE</h2>
    </section>

  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
